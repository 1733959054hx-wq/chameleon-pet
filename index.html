<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>灵动交互水晶灵龙 (Procedural Dragon Pet Pro)</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: radial-gradient(circle at 50% 35%, #13203c 0%, #060b16 65%, #020409 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
    }
    #ui-container {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 296px;
    }
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 8px 14px;
      border-radius: 10px;
      color: #f8fafc;
      font-size: 13px;
    }
    .state-badge {
      padding: 2px 10px;
      border-radius: 99px;
      font-size: 11px;
      font-weight: 600;
      background: rgba(56, 189, 248, 0.25);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.4);
      transition: all 0.25s ease;
    }
    .btn-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .btn {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 9px 12px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      transition: all 0.2s ease;
      text-align: center;
    }
    .btn:hover { background: rgba(255, 255, 255, 0.22); transform: translateY(-1px); }
    
    #palette-container {
      display: flex;
      justify-content: space-around;
      align-items: center;
      background: rgba(0, 0, 0, 0.4);
      padding: 8px 12px;
      border-radius: 12px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .palette-btn {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.65);
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .palette-btn:hover, .palette-btn.active {
      transform: scale(1.22);
      border-color: #fff;
      box-shadow: 0 0 12px rgba(255, 255, 255, 0.6);
    }

    .tuning-card {
      background: rgba(0, 0, 0, 0.38);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      padding: 10px 12px;
      color: rgba(255, 255, 255, 0.85);
      font-size: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .slider-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .slider-row input[type="range"] {
      width: 125px;
      accent-color: #38bdf8;
      cursor: pointer;
    }

    .tips {
      color: rgba(255, 255, 255, 0.68);
      font-size: 12px;
      line-height: 1.65;
      background: rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 12px;
      border-radius: 10px;
    }
  </style>
</head>
<body>
  <div id="ui-container">
    <div class="status-bar">
      <span>🐉 水晶灵龙状态</span>
      <span id="state-badge" class="state-badge">FOLLOW · 尾随</span>
    </div>

    <div class="btn-row">
      <button id="form-toggle" class="btn">🐾 陆地爬行</button>
      <button id="mode-toggle" class="btn">🖱️ 鼠标控制</button>
    </div>

    <div class="btn-row">
      <button id="spawn-prey-btn" class="btn">🦋 召唤灵蝶群</button>
      <button id="pulse-btn" class="btn">✨ 龙脉流光脉冲</button>
    </div>

    <div id="palette-container"></div>

    <div class="tuning-card">
      <div class="slider-row">
        <span>响应灵敏度 (f): <strong id="freq-val">3.2</strong> Hz</span>
        <input id="freq-slider" type="range" min="1.2" max="6.0" step="0.2" value="3.2" />
      </div>
      <div class="slider-row">
        <span>弹簧阻尼比 (ζ): <strong id="zeta-val">0.72</strong></span>
        <input id="zeta-slider" type="range" min="0.35" max="1.4" step="0.05" value="0.72" />
      </div>
    </div>

    <div class="tips">
      <strong>🎮 全维交互指南：</strong><br/>
      • <strong>左键点击 / 手势捏合</strong>：弹舌捕食灵蝶或灵珠<br/>
      • <strong>右键按住 / 手势张掌 / E键</strong>：进入【伏低警戒】<br/>
      • <strong>轻抚龙身</strong>：鼠标在龙身上轻柔滑动触发愉悦流光<br/>
      • <strong>双击画面</strong>：在点击处生成可捕食的发光灵蝶<br/>
      • <strong>空格 / Tab</strong>：切换【陆地爬行 / 腾云游龙】<br/>
      • <strong>数字 1 ~ 5</strong>：切换 5 大全息水晶皮肤
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
